<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jerry AI 管理后台</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}
button,input,select{font:inherit}
.wrap{max-width:1100px;margin:auto;padding:22px}
h1{margin:0 0 18px;font-size:30px}
.card{background:#fff;border:1px solid #e3e5e8;border-radius:18px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
input,select{width:100%;border:1px solid #d8dce3;border-radius:12px;padding:12px;background:#fff}
button{border:1px solid #d8dce3;background:#fff;border-radius:12px;padding:11px 15px;cursor:pointer}
button.primary{background:#111;color:#fff;border-color:#111}
button.danger{background:#b42318;color:#fff;border-color:#b42318}
button.small{padding:8px 10px;font-size:13px}
.muted{color:#6b7280;font-size:13px;line-height:1.6}
.hidden{display:none}
.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.toolbar input{min-width:260px;flex:1}
.user{display:grid;grid-template-columns:minmax(220px,2fr) 100px 120px 280px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.user:last-child{border-bottom:0}
.email{font-weight:750;word-break:break-all}
.balance{font-weight:850;font-size:18px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}
.modal-card{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:20px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1}
.tab.active{background:#111;color:#fff;border-color:#111}
.section-title{font-size:20px;font-weight:800;margin:0 0 12px}
@media(max-width:820px){
  .user{grid-template-columns:1fr}
  .wrap{padding:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Jerry AI 管理后台</h1>

  <div id="loginCard" class="card">
    <div class="section-title">管理员登录</div>
    <div class="row">
      <input id="adminUsername" value="Jerry" placeholder="管理员账号">
      <input id="adminPassword" type="password" value="123456" placeholder="管理员密码">
    </div>
    <button class="primary" style="margin-top:12px" onclick="adminLogin()">登录</button>
    <div class="muted" style="margin-top:10px">
      初始账号：Jerry　初始密码：123456。首次登录后请立即修改。
    </div>
  </div>

  <div id="panel" class="hidden">
    <div class="card topbar">
      <div>
        <div style="font-weight:800">当前管理员：<span id="currentAdmin">Jerry</span></div>
        <div class="muted">可管理用户额度、重置用户密码、修改管理员账号和密码。</div>
      </div>
      <div class="actions">
        <button onclick="openAdminSettings()">修改管理员账号/密码</button>
        <button onclick="adminLogout()">退出</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input id="search" placeholder="搜索用户邮箱、昵称或用户ID">
        <button class="primary" onclick="loadUsers()">搜索</button>
        <button onclick="clearSearch()">全部用户</button>
      </div>
    </div>

    <div class="card">
      <div id="users"><div class="muted">正在加载用户...</div></div>
    </div>
  </div>
</div>

<div id="userModal" class="modal">
  <div class="modal-card">
    <div class="section-title" id="userModalTitle">管理用户</div>
    <div id="userModalEmail" class="muted"></div>

    <div class="tabs" style="margin-top:16px">
      <button id="balanceTab" class="tab active" onclick="switchUserTab('balance')">管理额度</button>
      <button id="passwordTab" class="tab" onclick="switchUserTab('password')">重置密码</button>
    </div>

    <div id="balanceSection">
      <div class="row">
        <select id="balanceMode">
          <option value="adjust">增加 / 扣除额度</option>
          <option value="set">直接设置总额度</option>
        </select>
        <input id="balanceValue" type="number" step="0.01" placeholder="例如 100 或 -20">
      </div>
      <input id="balanceNote" style="margin-top:10px" placeholder="备注，例如：支付宝充值100元">
      <button class="primary" style="width:100%;margin-top:12px" onclick="submitBalance()">确认修改额度</button>
    </div>

    <div id="passwordSection" class="hidden">
      <input id="newUserPassword" type="password" placeholder="输入用户新密码，至少8位">
      <button class="danger" style="width:100%;margin-top:12px" onclick="resetUserPassword()">重置用户密码</button>
      <div class="muted" style="margin-top:8px">重置后，该用户当前登录设备会被自动退出。</div>
    </div>

    <button style="width:100%;margin-top:12px" onclick="closeUserModal()">关闭</button>
  </div>
</div>

<div id="adminSettingsModal" class="modal">
  <div class="modal-card">
    <div class="section-title">修改管理员账号 / 密码</div>
    <input id="currentAdminPassword" type="password" placeholder="当前管理员密码">
    <input id="newAdminUsername" style="margin-top:10px" placeholder="新管理员账号">
    <input id="newAdminPassword" type="password" style="margin-top:10px" placeholder="新密码（不修改可留空）">
    <button class="primary" style="width:100%;margin-top:12px" onclick="changeAdminCredentials()">保存修改</button>
    <button style="width:100%;margin-top:10px" onclick="closeAdminSettings()">取消</button>
  </div>
</div>

<script>
const API="https://jerry123.834833904.workers.dev";
const TOKEN_KEY="jerry_admin_panel_token";
let selectedUser=null;

function token(){return localStorage.getItem(TOKEN_KEY)||""}

async function api(path,options={}){
  const headers=Object.assign({"Content-Type":"application/json"},options.headers||{});
  if(token())headers.Authorization=`Bearer ${token()}`;

  const response=await fetch(API+path,{...options,headers});
  const data=await response.json().catch(()=>({ok:false,error:`HTTP ${response.status}`}));

  if(!response.ok||data.ok===false){
    if(response.status===401)localStorage.removeItem(TOKEN_KEY);
    throw new Error(data.error||`HTTP ${response.status}`);
  }
  return data;
}

async function adminLogin(){
  try{
    const username=document.getElementById("adminUsername").value.trim();
    const password=document.getElementById("adminPassword").value;
    const data=await api("/api/admin-panel/login",{
      method:"POST",
      body:JSON.stringify({username,password})
    });
    localStorage.setItem(TOKEN_KEY,data.token);
    document.getElementById("currentAdmin").textContent=data.username;
    showPanel();
    await loadUsers();
  }catch(e){alert(e.message)}
}

async function verifyAdmin(){
  if(!token())return showLogin();
  try{
    const data=await api("/api/admin-panel/me");
    document.getElementById("currentAdmin").textContent=data.username;
    showPanel();
    loadUsers();
  }catch{
    showLogin();
  }
}

function showPanel(){
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
}

function showLogin(){
  document.getElementById("loginCard").classList.remove("hidden");
  document.getElementById("panel").classList.add("hidden");
}

function adminLogout(){
  localStorage.removeItem(TOKEN_KEY);
  showLogin();
}

async function loadUsers(){
  try{
    const q=encodeURIComponent(document.getElementById("search").value.trim());
    const data=await api("/api/admin-panel/users?q="+q);
    const box=document.getElementById("users");

    if(!data.items.length){
      box.innerHTML='<div class="muted">没有找到用户</div>';
      return;
    }

    box.innerHTML=data.items.map(user=>`
      <div class="user">
        <div>
          <div class="email">${escapeHtml(user.email||"-")}</div>
          <div class="muted">${escapeHtml(user.name||"-")}<br>${escapeHtml(user.id)}</div>
        </div>
        <div>${escapeHtml(user.role||"user")}</div>
        <div class="balance">¥${Number(user.balance||0).toFixed(2)}</div>
        <div class="actions">
          <button class="small primary" onclick='openUserModal(${JSON.stringify(JSON.stringify(user))},"balance")'>管理额度</button>
          <button class="small" onclick='openUserModal(${JSON.stringify(JSON.stringify(user))},"password")'>重置密码</button>
        </div>
      </div>
    `).join("");
  }catch(e){alert(e.message)}
}

function clearSearch(){
  document.getElementById("search").value="";
  loadUsers();
}

function openUserModal(raw,tab){
  selectedUser=JSON.parse(raw);
  document.getElementById("userModalTitle").textContent=`管理用户 · 当前额度 ¥${Number(selectedUser.balance||0).toFixed(2)}`;
  document.getElementById("userModalEmail").textContent=selectedUser.email||"";
  document.getElementById("balanceValue").value="";
  document.getElementById("balanceNote").value="";
  document.getElementById("newUserPassword").value="";
  switchUserTab(tab);
  document.getElementById("userModal").classList.add("show");
}

function closeUserModal(){
  document.getElementById("userModal").classList.remove("show");
  selectedUser=null;
}

function switchUserTab(tab){
  const balance=tab==="balance";
  document.getElementById("balanceTab").classList.toggle("active",balance);
  document.getElementById("passwordTab").classList.toggle("active",!balance);
  document.getElementById("balanceSection").classList.toggle("hidden",!balance);
  document.getElementById("passwordSection").classList.toggle("hidden",balance);
}

async function submitBalance(){
  if(!selectedUser)return;
  const mode=document.getElementById("balanceMode").value;
  const value=Number(document.getElementById("balanceValue").value);
  const note=document.getElementById("balanceNote").value.trim();

  if(!Number.isFinite(value))return alert("请输入正确额度");

  try{
    const data=await api("/api/admin-panel/balance-adjust",{
      method:"POST",
      body:JSON.stringify({
        userId:selectedUser.id,
        mode,
        value,
        note
      })
    });

    alert(
      `修改成功\n原额度：¥${Number(data.oldBalance).toFixed(2)}\n`+
      `本次变化：¥${Number(data.delta).toFixed(2)}\n`+
      `最新额度：¥${Number(data.newBalance).toFixed(2)}`
    );

    closeUserModal();
    loadUsers();
  }catch(e){alert(e.message)}
}

async function resetUserPassword(){
  if(!selectedUser)return;
  const newPassword=document.getElementById("newUserPassword").value;

  if(newPassword.length<8)return alert("用户新密码至少8位");
  if(!confirm(`确认重置 ${selectedUser.email} 的密码？`))return;

  try{
    const data=await api("/api/admin-panel/reset-user-password",{
      method:"POST",
      body:JSON.stringify({
        userId:selectedUser.id,
        newPassword
      })
    });
    alert(data.message||"密码已重置");
    closeUserModal();
  }catch(e){alert(e.message)}
}

function openAdminSettings(){
  document.getElementById("currentAdminPassword").value="";
  document.getElementById("newAdminUsername").value=document.getElementById("currentAdmin").textContent||"Jerry";
  document.getElementById("newAdminPassword").value="";
  document.getElementById("adminSettingsModal").classList.add("show");
}

function closeAdminSettings(){
  document.getElementById("adminSettingsModal").classList.remove("show");
}

async function changeAdminCredentials(){
  const currentPassword=document.getElementById("currentAdminPassword").value;
  const newUsername=document.getElementById("newAdminUsername").value.trim();
  const newPassword=document.getElementById("newAdminPassword").value;

  if(!currentPassword)return alert("请输入当前管理员密码");
  if(!newUsername)return alert("请输入管理员账号");

  try{
    const data=await api("/api/admin-panel/change-credentials",{
      method:"POST",
      body:JSON.stringify({
        currentPassword,
        newUsername,
        newPassword
      })
    });

    alert(data.message);
    localStorage.removeItem(TOKEN_KEY);
    closeAdminSettings();
    document.getElementById("adminUsername").value=data.username;
    document.getElementById("adminPassword").value="";
    showLogin();
  }catch(e){alert(e.message)}
}

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,ch=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

verifyAdmin();
</script>
</body>
</html>
