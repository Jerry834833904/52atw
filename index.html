<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jerry AI 管理后台</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f6f7f9;color:#111}
.wrap{max-width:980px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:16px}
h1{margin:0 0 18px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}
input,select,button{font:inherit;border-radius:12px;padding:11px 12px;border:1px solid #d8dce3;background:#fff}
button{cursor:pointer}.primary{background:#111;color:#fff;border-color:#111}.danger{background:#b42318;color:#fff;border-color:#b42318}
.muted{color:#6b7280;font-size:13px}.hidden{display:none}
.user{display:grid;grid-template-columns:minmax(170px,2fr) 1fr 110px 130px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.user:last-child{border-bottom:0}.email{font-weight:700;word-break:break-all}.balance{font-weight:800}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}
.modal-card{background:#fff;width:min(520px,100%);border-radius:20px;padding:20px}
@media(max-width:700px){.user{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Jerry AI 管理后台</h1>

  <div id="loginCard" class="card">
    <h3>管理员登录</h3>
    <div class="row">
      <input id="username" type="text" placeholder="管理员账号" value="Jerry">
      <input id="password" type="password" placeholder="密码">
    </div>
    <button class="primary" style="margin-top:12px" onclick="login()">登录</button>
    <div class="muted" style="margin-top:10px">默认管理员账号：Jerry。首次登录后请在 Cloudflare Worker 变量中修改管理员密码。</div>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="card">
      <div class="toolbar">
        <input id="search" placeholder="搜索邮箱、昵称或用户ID">
        <button onclick="loadUsers()">搜索用户</button>
        <button onclick="loadUsers(true)">刷新</button>
        <button onclick="showAllChats()">查看全部聊天记录</button>
        <button onclick="logout()">退出</button>
      </div>
    </div>
    <div id="usersCard" class="card">
      <div id="users"></div>
    </div>

    <div id="allChatsCard" class="card hidden">
      <div class="toolbar" style="margin-bottom:12px">
        <input id="allChatsSearch" placeholder="搜索邮箱、聊天内容或模型">
        <button onclick="loadAllChats()">搜索记录</button>
        <button onclick="showUsersPanel()">返回余额管理</button>
      </div>
      <div class="muted" style="margin-bottom:10px">管理员可以查看所有登录邮箱保存的聊天记录。旧版本本地聊天需用户至少打开一次新版网页并保持登录，系统会自动同步到后台。</div>
      <div id="allChatsList"></div>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-card">
    <h3 id="modalTitle">修改余额</h3>
    <div class="muted" id="modalEmail"></div>
    <div class="row" style="margin-top:14px">
      <select id="mode">
        <option value="adjust">增加 / 扣除金额</option>
        <option value="set">直接设置余额</option>
      </select>
      <input id="value" type="number" step="0.01" placeholder="金额，例如 50 或 -10">
    </div>
    <input id="note" style="width:100%;margin-top:10px" placeholder="备注，例如：支付宝充值 50 元">
    <div class="row" style="margin-top:14px">
      <button onclick="closeModal()">取消</button>
      <button class="primary" onclick="submitBalance()">确认修改</button>
    </div>
  </div>
</div>

<script>
const API="https://jerry123.834833904.workers.dev";
const TOKEN_KEY="jerry_admin_token";
const DEVICE_KEY="jerry_admin_device";
let currentUserId="";

function deviceId(){
  let id=localStorage.getItem(DEVICE_KEY);
  if(!id){id=crypto.randomUUID?crypto.randomUUID():`admin-${Date.now()}-${Math.random().toString(16).slice(2)}`;localStorage.setItem(DEVICE_KEY,id)}
  return id;
}
function token(){return localStorage.getItem(TOKEN_KEY)||""}
async function api(path,options={}){
  const headers=Object.assign({"Content-Type":"application/json","X-Device-Id":deviceId()},options.headers||{});
  if(token())headers.Authorization=`Bearer ${token()}`;
  const r=await fetch(API+path,{...options,headers});
  const d=await r.json().catch(()=>({ok:false,error:`HTTP ${r.status}`}));
  if(!r.ok||d.ok===false)throw new Error(d.error||`HTTP ${r.status}`);
  return d;
}
async function login(){
  try{
    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value;
    if(!username||!password)throw new Error("请输入管理员账号和密码");

    const d=await api("/api/admin/login",{
      method:"POST",
      body:JSON.stringify({username,password,deviceId:deviceId()})
    });

    if(d.user?.role!=="admin"){
      localStorage.removeItem(TOKEN_KEY);
      throw new Error("无管理员权限");
    }

    localStorage.setItem(TOKEN_KEY,d.token);
    showAdmin();
    await loadUsers();
  }catch(e){alert(e.message)}
}
function showAdmin(){document.getElementById("loginCard").classList.add("hidden");document.getElementById("adminPanel").classList.remove("hidden")}
function showLogin(){document.getElementById("loginCard").classList.remove("hidden");document.getElementById("adminPanel").classList.add("hidden")}
async function verify(){
  if(!token())return showLogin();
  try{const d=await api("/api/me");if(d.user?.role!=="admin")throw new Error("无管理员权限");showAdmin();loadUsers()}catch(e){localStorage.removeItem(TOKEN_KEY);showLogin()}
}
async function loadUsers(clear=false){
  if(clear)document.getElementById("search").value="";
  try{
    const q=encodeURIComponent(document.getElementById("search").value.trim());
    const d=await api("/api/admin/users?q="+q);
    const box=document.getElementById("users");
    if(!d.items.length){box.innerHTML='<div class="muted">没有找到用户</div>';return}
    box.innerHTML=d.items.map(u=>`
      <div class="user">
        <div><div class="email">${esc(u.email||"-")}</div><div class="muted">${esc(u.name||"-")} · ${esc(u.id)}</div></div>
        <div>${esc(u.role||"user")}</div>
        <div class="balance">¥${Number(u.balance||0).toFixed(2)}</div>
        <button onclick='openModal(${JSON.stringify(JSON.stringify({id:u.id,email:u.email,balance:u.balance}))})'>修改余额</button>
      </div>`).join("");
  }catch(e){alert(e.message)}
}
function openModal(raw){
  const u=JSON.parse(raw);currentUserId=u.id;
  document.getElementById("modalTitle").textContent=`修改余额（当前 ¥${Number(u.balance||0).toFixed(2)}）`;
  document.getElementById("modalEmail").textContent=u.email||"";
  document.getElementById("value").value="";
  document.getElementById("note").value="";
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
async function submitBalance(){
  const mode=document.getElementById("mode").value;
  const value=Number(document.getElementById("value").value);
  const note=document.getElementById("note").value.trim();
  if(!Number.isFinite(value))return alert("请输入金额");
  if(!confirm(`确认${mode==="set"?"设置":"调整"}该用户余额？`))return;
  try{
    const d=await api("/api/admin/balance-adjust",{method:"POST",body:JSON.stringify({userId:currentUserId,mode,value,note})});
    alert(`修改成功\\n原余额：¥${Number(d.oldBalance).toFixed(2)}\\n变动：¥${Number(d.delta).toFixed(2)}\\n新余额：¥${Number(d.newBalance).toFixed(2)}`);
    closeModal();loadUsers();
  }catch(e){alert(e.message)}
}

function showAllChats(){
  document.getElementById("usersCard").classList.add("hidden");
  document.getElementById("allChatsCard").classList.remove("hidden");
  loadAllChats();
}

function showUsersPanel(){
  document.getElementById("allChatsCard").classList.add("hidden");
  document.getElementById("usersCard").classList.remove("hidden");
}

async function loadAllChats(){
  try{
    const q=encodeURIComponent(String(document.getElementById("allChatsSearch").value||"").trim());
    const data=await api(`/api/admin/chat-history?q=${q}&limit=1000`);
    const box=document.getElementById("allChatsList");
    const items=data.items||[];

    if(!items.length){
      box.innerHTML='<div class="muted">没有找到聊天记录。请确认客户已经使用新版前端并登录过，旧版本本地聊天会在客户打开新版后自动同步。</div>';
      return;
    }

    box.innerHTML=items.map(item=>`
      <div style="padding:12px 0;border-bottom:1px solid #eee">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <strong>${esc(item.user_email||"-")}</strong>
          <span class="muted">${esc(item.created_at||"")}</span>
        </div>
        <div class="muted" style="margin-top:4px">${item.role==="user"?"用户":"AI"} · ${esc(item.model||"")}</div>
        <div style="white-space:pre-wrap;line-height:1.6;margin-top:7px">${esc(item.content||"")}</div>
      </div>
    `).join("");
  }catch(error){
    alert(error.message);
  }
}

async function logout(){
  try{if(token())await api("/api/auth/logout",{method:"POST",body:JSON.stringify({deviceId:deviceId()})})}catch{}
  localStorage.removeItem(TOKEN_KEY);showLogin();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
verify();
</script>
</body>
</html>
